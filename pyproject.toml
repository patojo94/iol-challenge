[project]
name = "iol-pipeline"
version = "0.1.0"
description = "Pipeline de operaciones bursátiles BYMA - IOL Inversiones"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Cliente de Yahoo Finance (Task 04). En Databricks: %pip install yfinance
integrations = ["yfinance>=0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
